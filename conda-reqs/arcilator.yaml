dependencies:
    # Host tools for the reproducible native Arcilator LLVM construction.
    # Keep all profile producers/consumers and the ThinLTO linker on LLVM 18.
    - clang=18.1.8
    - clangxx=18.1.8
    - lld=18.1.8
    - llvm-tools=18.1.8
    - compiler-rt=18.1.8
    - cmake>=3.20
    - python>=3.10,<3.11
    - patch
    - wget
    - tar
    - gzip

    - libz3>=4,<5 # native solver library required by the CIRCT SDK
    - zlib # development headers/library required when reconstructing LLVM
