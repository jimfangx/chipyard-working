    E15: vdd_io
    E14: vdd_core
    E13: vdd_core
    E12: vdd_io
    # Keep a normal slice on the local right of the E11 clamped3 pad.
    IO_FILLER_MANUAL_E_1:
      cell: sky130_ef_io__com_bus_slice_20um
      width: 20
    E11: vssd
    E10: vssd
    E9: vdd_io
    E8: vdd_core
    E7: vdd_core
    E6: vdd_io
    E5: vssd
    E4: vssd
    E3: vdd_io
    # Keep a normal slice on the local right of the E2 clamped3 pad.
    IO_FILLER_MANUAL_E_2:
      cell: sky130_ef_io__com_bus_slice_20um
      width: 20
    E2: vdd_core
    E1: vdd_core

  bottom:
    S1: vdd_core
    S2: reset_io
    # Abut the reset cell's far edge to provide its bus-slice tap. The explicit
    # mode is needed because bottom-side guard fillers normally abut the next pad.
    IO_FILLER_RESET_TAP:
      cell: sky130_ef_io__com_bus_slice_20um
      width: 20
      abut: previous
    S3: clock
    # Keep the original bottom clamp guard immediately before S4.
    IO_FILLER_MANUAL_S_2:
      cell: sky130_ef_io__com_bus_slice_20um
      width: 20
    S4: vdd_core
    S5: vdd_io
    S6: vssd
    S7: vdd_core
    S8: vdd_io
    S9: vssd
    S10: vdd_core
    S11: vdd_io
    S12: vssio
    # PoR/level-shifter routing hook near the far end of the bottom edge.
    IO_FILLER_MANUAL_S_3:
      cell: sky130_ef_io__com_bus_slice_20um
      width: 20
    S13: vdd_core

