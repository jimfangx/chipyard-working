iocell_type:
  corner: sky130_ef_io__corner_pad
  vdd_core: sky130_ef_io__vccd_lvc_clamped3_pad
  vss_core: sky130_ef_io__vssd_lvc_clamped3_pad
  vdd_io: sky130_ef_io__vddio_hvc_clamped_pad
  vss_io: sky130_ef_io__vssio_hvc_clamped_pad
  gpio: sky130_ef_io__gpiov2_pad_wrapped
  reset: sky130_fd_io__top_xres4v2

pitch:
  pad_width: 75
  top_slots: 13
  top_offset: 381
  top_pitch: 700
  right_slots: 70
  right_offset: 340
  # Spread the vertical pads across the full 25 mm edge. With the 204 um
  # corners, this leaves about 136 um for fillers at both ends of each side.
  right_pitch: 351.375
  bottom_slots: 13
  bottom_offset: 381
  bottom_pitch: 739
  left_slots: 70
  left_offset: 340
  left_pitch: 351.375

# Numbered entries use their explicit pin number to select a slot on each side's
# offset/pitch grid. Every slot is populated: design IOs use their signal names,
# and all remaining non-power slots use synthesized nc_N instances. Do not omit
# a numbered slot. Change a pin's value to manually assign that IO cell.
pins:
  top:
    N1: vdd_core
    N2: vdd_io
    N3: vssio
    N4: vssio
    N5: clock_tap
    N6: vdd_io
    N7: vdd_core
    N8: vdd_io
    N9: vssd
    N10: vdd_core
    N11: vdd_io
    N12: vssio
    N13: vdd_core

  right:
    E70: vssd
    E69: vdd_io
    E68: vdd_core
    E67: serial_tl_0_clock_in
    E66: serial_tl_0_in_valid
    E65: serial_tl_0_in_ready
    E64: custom_boot
    E63: vssd
    E62: vdd_io
    E61: vdd_core
    E60: serial_tl_0_in_bits_phit
    E59: nc_27
    E58: nc_0
    E57: nc_28
    E56: nc_29
    E55: nc_1
    E54: nc_30
    E53: nc_2
    E52: vssd
