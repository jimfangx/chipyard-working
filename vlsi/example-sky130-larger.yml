# EDA Tooling Setup
# Genus options
vlsi.core.synthesis_tool: "hammer.synthesis.genus"
synthesis.genus.version: "231_ISR4"
synthesis.genus.genus_bin: "/tools/cadence/DDI/DDI231_ISR4/bin/genus"

# Innovus options
vlsi.core.par_tool: "hammer.par.innovus"
par.innovus.version: "231"
par.innovus.innovus_bin: "/tools/cadence/DDI/DDI231_ISR4/bin/innovus"
par.innovus.design_flow_effort: "standard"
par.inputs.gds_merge: true
# Pegaus options, cadence pdk only has a pegasus deck
vlsi.core.drc_tool: "hammer.drc.pegasus"
drc.pegasus.version: "231"
drc.pegasus.pegasus_bin: "/tools/cadence/PEGASUS/PEGASUS231/bin/pegasus"
vlsi.core.lvs_tool: "hammer.lvs.pegasus"
lvs.pegasus.pegasus_bin: "/tools/cadence/PEGASUS/PEGASUS231/bin/pegasus"
lvs.pegasus.version: "231"
# VCS options
vlsi.core.sim_tool: "hammer.sim.vcs"
sim.vcs.version: "T-2022.06-SP2-9"
sim.vcs.vcs_bin: "/share/instsww/synopsys-new/vcs/T-2022.06-SP2-9/bin/vcs"
sim.vcs.vcs_home: "/share/instsww/synopsys-new/vcs/T-2022.06-SP2-9/"
sim.vcs.verdi_bin: "/share/instsww/synopsys-new/verdi/T-2022.06-SP2/bin/verdi"
sim.vcs.verdi_home: "/share/instsww/synopsys-new/verdi/T-2022.06-SP2/"
# sim.outputs.waveforms: "/scratch/eecs251b-aae/chipyard/vlsi/output"
# Voltus options
vlsi.core.power_tool: "hammer.power.voltus"
power.joules.version: "211"
power.voltus.version: "211_ISR3"

# Commercial tool licenses/paths
mentor.mentor_home: "/tools/mentor"
mentor.MGLS_LICENSE_FILE: "1717@bwrcflex-1.eecs.berkeley.edu:1717@bwrcflex-2.eecs.berkeley.edu"

cadence.cadence_home: "/tools/cadence"
cadence.CDS_LIC_FILE: "5280@bwrcflex-1.eecs.berkeley.edu:5280@bwrcflex-2.eecs.berkeley.edu"

synopsys.synopsys_home: "/tools/synopsys"
synopsys.SNPSLMD_LICENSE_FILE: "1701@bwrcflex-1.eecs.berkeley.edu:1701@bwrcflex-2.eecs.berkeley.edu"
synopsys.MGLS_LICENSE_FILE: "1717@bwrcflex-1.eecs.berkeley.edu:1717@bwrcflex-2.eecs.berkeley.edu"

# Generate Make include to aid in flow
vlsi.core.build_system: make


# =================================================================================================

# Technology Setup
# Technology used is Sky130
vlsi.core.technology: "hammer.technology.sky130"

# Adjust this based on your tooling license & compute environment
vlsi.core.max_threads: 32

technology.core.stackup: "sky130_scl"

vlsi.technology.placement_site: "CoreSite"

# Technology paths
technology.sky130:
  sky130A: "/scratch/jfx/open-pdks/sky130/sky130A" # TODO(jimfang) bump to tools

  # Cadence SkyWater 130nm PDK Path
  sky130_cds: "/tools/commercial/skywater/sky130_cds/PDK/sky130_release_0.0.9"
  # Cadence SkyWater 130nm Standard Cell Library Path
  sky130_scl: "/tools/commercial/skywater/sky130_cds/LIB/sky130_scl_9T_0.1.2" # TODO(jimfang) - change before prod
  sram22_sky130_macros: "/scratch/jfx/sram22_sky130_macros" # amd 5 scratch for now

  # Pegasus rule decks provided by the Cadence PDK release
  # drc_deck: "${technology.sky130.sky130_cds}/Sky130_DRC/sky130_rev_0.0_2.12.drc.pvl"
  drc_deck: "/scratch/jfx/sky130_release_0.1.0/Sky130_DRC/sky130_rev_0.0_2.12.drc.pvl"

  pegasus_drc_rules_dir: "/scratch/jfx/sky130_release_0.1.0/Sky130_DRC"
  pegasus_drc_rules_dir_meta: lazysubst

  # lvs_deck: "${technology.sky130.sky130_cds}/Sky130_LVS/sky130.lvs.v0.0_1.1.pvl"
  lvs_deck: "/scratch/jfx/sky130_release_0.1.0/Sky130_LVS/sky130.lvs.v0.0_1.1.pvl"

  # this key is OPTIONAL, no NDA files will be used if it does not point to a valid path
  sky130_nda: "/path/to/skywater-src-nda"

  drc_blackbox_srams: false

  stdcell_library: "sky130_scl"

  # caravel: "/scratch/jfx/caravel"

  misc_tapeout_collateral: "/scratch/jfx/cadence-skywater-130-pdk"

  io_file: "./chip-sky130-larger.io"
  io_file_meta: prependlocal

# SRAM Compiler compiler options
vlsi.core.sram_generator_tool: "hammer.technology.sky130.sram_compiler"



# Power Straps
par.power_straps_mode: generate
par.generate_power_straps_method: by_tracks
par.blockage_spacing: 2.0
par.blockage_spacing_top_layer: met3
par.generate_power_straps_options:
  by_tracks:
    generate_rail_layer: false # sky130_scl has a hook for rails
    strap_layers:
      - met2
      - met3
      - met4
      - met5
    pin_layers:
      - met5
    blockage_spacing_met2: 4.0
    blockage_spacing_met3: 2.0
    blockage_spacing_met4: 2.0
    blockage_spacing_met5: 2.0

    track_spacing: 0

    track_start: 10
    track_start: 12
    track_start: 16
    track_start_met5: 1
  
    track_width: 2
    track_width_met2: 2
    track_width_met3: 2
    track_width_met4: 2
    track_width_met5: 2
    power_utilization_met2: 0.05
    power_utilization_met3: 0.15
    power_utilization_met4: 0.25
    power_utilization_met5: 0.4

# General Hammer Inputs
vlsi.inputs:
  power_spec_type: cpf
  power_spec_mode: manual
  power_spec_contents_meta: transclude
  power_spec_contents: ./sky130.cpf
  supplies:
    # Hammer should only know about the main core power nets
    # Other pins/nets/domains handled in CPF
    power:
      - {name: "VDD", pins: ["VDD"]}
    ground:
      - {name: "VSS", pins: ["VSS"]}
    VDD: "1.8 V"
    GND: "0 V"

vlsi.inputs.top_module: ChipTop

vlsi.inputs.custom_sdc_constraints: [
    # "set_false_path -from reset -to system/chipyard_prcictrl_domain/clockDivider/divider_io_resetAsync_stretcher/resetout/reg_0_reg/CK"
    "set_false_path -from reset"
  ]

# Specify clock signals
vlsi.inputs.clocks: [
  {name: "clock", period: "200ns", uncertainty: "0.1ns"}
]

# Placement Constraints
vlsi.inputs.placement_constraints:
  - path: ChipTop
    type: toplevel
    x: 0
    y: 0
    width: 10000
    height: 25000
    margins:
      # Match the proven IO-ring offsets used by the PoR and reset-level-shifter
      # routing hooks. These values are exact multiples of the 1 nm mfg grid.
      left: 249.78
      right: 249.78
      top: 252.08
      bottom: 252.08

  # # Place SRAM memory instances
  # # data cache
  # - path: "ChipTop/system/tile_prci_domain/element_reset_domain_rockettile/dcache/data/rockettile_dcache_data_arrays_0/rockettile_dcache_data_arrays_0_ext/mem_0_0"
  #   type: hardmacro
  #   x: 49.68
  #   y: 149.6
  #   orientation: r90
  # - path: "ChipTop/system/tile_prci_domain/element_reset_domain_rockettile/dcache/data/rockettile_dcache_data_arrays_1/rockettile_dcache_data_arrays_0_ext/mem_0_0"
  #   type: hardmacro
  #   x: 49.68
  #   y: 748
  #   orientation: r90

  # # tag array
  # - path: "ChipTop/system/tile_prci_domain/element_reset_domain_rockettile/frontend/icache/rockettile_icache_tag_array_0/rockettile_icache_tag_array_0_ext/mem_0_0"
  #   type: hardmacro
  #   x: 2612.8
  #   y: 1033.6
  #   orientation: mx90

  # # instruction cache
  # - path: "ChipTop/system/tile_prci_domain/element_reset_domain_rockettile/frontend/icache/rockettile_icache_data_arrays_0_0/rockettile_icache_data_arrays_0_0_ext/mem_0_0"
  #   type: hardmacro
  #   x: 2612.8
  #   y: 149.6
  #   orientation: mx90
  # - path: "ChipTop/system/tile_prci_domain/element_reset_domain_rockettile/frontend/icache/rockettile_icache_data_arrays_1_0/rockettile_icache_data_arrays_0_0_ext/mem_0_0"
  #   type: hardmacro
  #   x: 2612.8
  #   y: 598.4
  #   orientation: mx90



# Pin placement constraints
vlsi.inputs.pin_mode: generated
vlsi.inputs.pin.generate_mode: semi_auto
vlsi.inputs.pin.assignments: [
  {pins: "*", layers: ["met2", "met4"], side: "bottom"}
]

vlsi.inputs.dont_use_mode: append
vlsi.inputs.dont_use_list_meta: append
vlsi.inputs.dont_use_list:
  - sky130_fd_sc_hvl__*

vlsi.inputs.decaps:
  - target: "density"
    density: 0.15

# ====================================================================
# Sky130 IO Cell Collat

.local.library.sky130_fd_sc_hvl__lsbufhv2lv: &lib__sky130_fd_sc_hvl__lsbufhv2lv
  gds_file: ${technology.sky130.misc_tapeout_collateral}/OPEN-PDKS-Modifications/sky130_fd_sc_hvl__lsbufhv2lv_1_m1_access/sky130_fd_sc_hvl__lsbufhv2lv_1.gds
  lef_file: cache/fd_sc_hvl__lef/sky130_fd_sc_hvl__lsbufhv2lv_1.lef
  spice_file: ${technology.sky130.misc_tapeout_collateral}/OPEN-PDKS-Modifications/sky130_fd_sc_hvl__lsbufhv2lv_1_m1_access/sky130_fd_sc_hvl__lsbufhv2lv_1.spice
  verilog_sim: ${technology.sky130.sky130A}/libs.ref/sky130_fd_sc_hvl/verilog/sky130_fd_sc_hvl.v
  provides:
    - lib_type: lvlshift
      vt: RVT

vlsi.technology.extra_libraries_meta: ["append", "lazydeepsubst"]
vlsi.technology.extra_libraries:
  # - library:
  #     spice_file: /tools/C/rahulkumar/sky130/stac2/lvs/devices.sp
  # lvs required rahul's devices.sp which maps the sky130a primitive names to the extraction deck primitive names -- jim: this should only be needed for calibre, which we are not using - see https://ucb-bar.slack.com/archives/C04BT3QEW4C/p1738516994635699?thread_ts=1738308068.017219&cid=C04BT3QEW4C
  
  # default plugin should include this now...
  # - library:
  #     spice_file: /scratch/jfx/open-pdks/sky130/sky130A/libs.ref/sky130_fd_io/spice/sky130_fd_io.spice
  # - library:
      # https://ucb-bar.slack.com/archives/C04BT3QEW4C/p1730980809217149 - `special_nshort` has since been removed from upstream
      # TODO(jimfang) wait; default plugin should include this now...
      # spice_file: ${technology.sky130.sky130A}/libs.ref/sky130_fd_sc_hd/cdl/sky130_fd_sc_hd.cdl
  - library:
      <<: *lib__sky130_fd_sc_hvl__lsbufhv2lv
      nldm_liberty_file: ${technology.sky130.sky130A}/libs.ref/sky130_fd_sc_hvl/lib/sky130_fd_sc_hvl__ss_100C_1v65_lv1v60.lib
      corner:
        nmos: "slow"
        pmos: "slow"
        temperature: "100 C"
      supplies:
        VDD: "1.60 V"
        GND: "0 V"
  - library:
      <<: *lib__sky130_fd_sc_hvl__lsbufhv2lv
      nldm_liberty_file: ${technology.sky130.sky130A}/libs.ref/sky130_fd_sc_hvl/lib/sky130_fd_sc_hvl__ff_n40C_5v50_lv1v95_ccsnoise.lib
      corner:
        nmos: "fast"
        pmos: "fast"
        temperature: "-40 C"
      supplies:
        VDD: "1.95 V"
        GND: "0 V"
  - library:
      <<: *lib__sky130_fd_sc_hvl__lsbufhv2lv
      nldm_liberty_file: ${technology.sky130.sky130A}/libs.ref/sky130_fd_sc_hvl/lib/sky130_fd_sc_hvl__tt_025C_3v30_lv1v80.lib
      corner:
        nmos: "typical"
        pmos: "typical"
        temperature: "025 C"
      supplies:
        VDD: "1.80 V"
        GND: "0 V"
